<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yassena Campo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Formulário oculto só para o Netlify detectar em build (varredura estática de HTML)
      e habilitar o Netlify Forms. Os campos precisam bater com os do formulário real,
      renderizado via React em SugestoesScreen. Nunca é exibido nem enviado por aqui.
    -->
    <form name="sugestoes" data-netlify="true" netlify-honeypot="empresa" hidden>
      <input type="text" name="tipo" />
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <textarea name="mensagem"></textarea>
      <input type="date" name="data_preferida" />
      <input type="text" name="empresa" />
    </form>
  </body>
</html>
